name: Cross platform tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test (defaults to the triggering ref)
        required: false
        type: string

permissions:
  contents: read

# A newer commit supersedes an in-flight run for the same ref. Reusable
# workflow calls get a per-run group so callers remain independent.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_call' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  unix:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-6vcpu-macos-latest, blacksmith-2vcpu-ubuntu-2404]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Run isolated Bash tests
        run: ./test.sh
      - name: Run PowerShell self-update lock regressions on macOS
        if: runner.os == 'macOS'
        shell: pwsh
        run: ./tests/self-update-lock-regressions.ps1

  windows:
    name: blacksmith-2vcpu-windows-2025
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Run isolated PowerShell tests
        shell: powershell
        run: |
          .\test.ps1
          .\tests\self-update-lock-regressions.ps1

  legacy-linux-node:
    name: ubuntu-20.04-managed-node
    runs-on: blacksmith-2vcpu-ubuntu-2404
    container: ubuntu:20.04
    timeout-minutes: 10
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify Node 18+ fallback on the oldest supported Ubuntu
        run: |
          node_root="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          CLAUDEX_TEST_MODE=1 CLAUDEX_TEST_MANAGED_NODE_DIR="$node_root" ./tests/legacy-linux-node.sh

  node-18-shared-runtime:
    name: node-18-shared-runtime
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18
      - name: Verify the minimum supported shared Node.js runtime
        run: npm test

  package-artifacts:
    name: package-artifacts
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Verify package metadata
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!pkg.version || !Array.isArray(pkg.files) || pkg.files.length === 0) {
            throw new Error('package metadata is missing version or release files');
          }
          NODE
      - name: Verify reproducible and type-safe release archives
        run: ./scripts/check-release-artifacts.sh
